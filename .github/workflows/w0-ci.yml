name: W0 Compiler CI

on:
  pull_request:
    paths:
      - "w0/**"
      - "lib/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build compiler
        run: make

      - name: Build test runner
        working-directory: w0
        run: bin/w0 --lib-path ../lib tools/test_runner.w | cc -x c -I../lib/include -o bin/test_runner - ../lib/whist_runtime.c

      - name: Run tests
        working-directory: w0
        run: make test
